services:
  mongo:
    image: mongo:7
    container_name: campustrade-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - campustrade-mongo-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: campustrade-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"

volumes:
  campustrade-mongo-data:
